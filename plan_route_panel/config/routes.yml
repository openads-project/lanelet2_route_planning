# Saved WGS84 routes use the same waypoint strings as the action client's
# "waypoints" parameter: "latitude, longitude[, wait_time_s]".
# A negative wait time marks an intermediate destination. The final waypoint
# must be a stop (nonnegative wait time, or no wait time).
routes:
  example_route:
    - "50.787524, 6.050095, -1"
    - "50.779794, 6.050634, -1"
    - "50.784935, 6.043669, -1"
    - "50.787801, 6.046555"
